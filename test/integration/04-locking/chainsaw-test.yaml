apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: annotation-locking
spec:
  timeouts:
    exec: 6m
  skipDelete: false
  namespace: locking
  steps:
  - name: Prepare distributed-mode RBAC
    try:
    - apply:
        resource:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            name: serverless-kube-watch-trigger-distributed-role
          rules:
          - apiGroups:
            - ""
            resources:
            - configmaps
            verbs:
            - get
            - list
            - watch
            - create
            - update
            - patch
    - apply:
        resource:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: serverless-kube-watch-trigger-distributed-rolebinding
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: serverless-kube-watch-trigger-distributed-role
          subjects:
          - kind: ServiceAccount
            name: serverless-kube-watch-trigger-controller-manager
            namespace: serverless-kube-watch-trigger-system
  - name: Enable annotation locking with multiple replicas
    try:
    - script:
        content: |
          set -euo pipefail
          patch=$(cat <<'EOF'
          {
            "spec": {
              "replicas": 2,
              "template": {
                "spec": {
                  "containers": [
                    {
                      "name": "manager",
                      "args": [
                        "--enable-leader-election=false",
                        "--health-probe-bind-address=:8081"
                      ],
                      "env": [
                        {
                          "name": "POD_NAME",
                          "valueFrom": {
                            "fieldRef": {
                              "fieldPath": "metadata.name"
                            }
                          }
                        },
                        {
                          "name": "POD_NAMESPACE",
                          "valueFrom": {
                            "fieldRef": {
                              "fieldPath": "metadata.namespace"
                            }
                          }
                        }
                      ]
                    }
                  ]
                }
              }
            }
          }
          EOF
          )
          kubectl patch deployment serverless-kube-watch-trigger-controller-manager \
            -n serverless-kube-watch-trigger-system \
            --type=strategic \
            -p "$patch"
          kubectl rollout status deployment/serverless-kube-watch-trigger-controller-manager \
            -n serverless-kube-watch-trigger-system --timeout=300s
          kubectl wait --for=jsonpath='{.status.readyReplicas}'=2 \
            deployment/serverless-kube-watch-trigger-controller-manager \
            -n serverless-kube-watch-trigger-system --timeout=300s
    # This step rewrites the operator into a two-replica, leader-election-free
    # shape. Restoring it has to happen even when a later step fails, otherwise
    # the cluster is left with two non-leader replicas and every later run
    # silently stops reconciling.
    finally:
    - script:
        content: |
          set -uo pipefail
          kubectl delete clusterrolebinding \
            serverless-kube-watch-trigger-distributed-rolebinding --ignore-not-found
          kubectl delete clusterrole \
            serverless-kube-watch-trigger-distributed-role --ignore-not-found
          kubectl patch deployment serverless-kube-watch-trigger-controller-manager \
            -n serverless-kube-watch-trigger-system --type=strategic \
            -p '{"spec":{"replicas":1,"template":{"spec":{"containers":[{"name":"manager","args":["--leader-elect","--health-probe-bind-address=:8081"]}]}}}}'
          kubectl rollout status deployment/serverless-kube-watch-trigger-controller-manager \
            -n serverless-kube-watch-trigger-system --timeout=300s
  - name: Create webhook backend
    try:
    - apply:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: locking-http-backend
            namespace: locking
            labels:
              app: locking-http-backend
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: locking-http-backend
            template:
              metadata:
                labels:
                  app: locking-http-backend
              spec:
                containers:
                - name: nginx
                  image: nginx:latest
                  ports:
                  - containerPort: 80
    - apply:
        resource:
          apiVersion: v1
          kind: Service
          metadata:
            name: locking-http-backend
            namespace: locking
          spec:
            selector:
              app: locking-http-backend
            ports:
            - protocol: TCP
              port: 8894
              targetPort: 80
    - assert:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: locking-http-backend
            namespace: locking
          status:
            readyReplicas: 1
  - name: Create HTTPTrigger and verify lease is written then cleared
    try:
    - script:
        content: |
          set -euo pipefail

          # The annotation lease only exists for the duration of a single
          # reconcile, which is far shorter than a polling interval, so the
          # trigger is created while a watch on the whole collection is
          # recording every object version. Watching the collection (rather
          # than the single object) also lets the watch start before the
          # trigger exists, which a named watch cannot do.
          #
          # Fields are separated by "|" rather than a tab: kubectl's jsonpath
          # does not emit a real tab for {"\t"}, and the script runs under a
          # busybox shell whose awk does not treat -F'\t' as a tab either.
          watch_file="$(mktemp)"
          kubectl get httptriggers -n locking --watch \
            --output=jsonpath='{.metadata.name}{"|"}{.metadata.annotations.triggers\.harikube\.info/lock-timestamp}{"|"}{.status.phase}{"\n"}' \
            > "$watch_file" 2>&1 &
          watch_pid=$!
          sleep 2

          kubectl apply -f - >/dev/null <<'EOF'
          apiVersion: triggers.harikube.info/v1
          kind: HTTPTrigger
          metadata:
            name: locking-httptrigger
            namespace: locking
            labels:
              triggers.harikube.info/distribution: item-1
          spec:
            resource:
              apiVersion: v1
              kind: ConfigMap
            namespaces:
            - locking
            labelSelectors:
            - watch-e2e-locking=true
            eventTypes:
            - MODIFIED
            lockDuration: 6s
            url:
              service:
                name: locking-http-backend
                namespace: locking
                uri:
                  static: "/"
            method: GET
          EOF

          settled=""
          for _ in $(seq 1 80); do
            phase="$(kubectl get httptrigger locking-httptrigger -n locking -o jsonpath='{.status.phase}' 2>/dev/null || true)"
            annotation="$(kubectl get httptrigger locking-httptrigger -n locking -o jsonpath='{.metadata.annotations.triggers\.harikube\.info/lock-timestamp}' 2>/dev/null || true)"
            if [ "$phase" = "Running" ] && [ -z "$annotation" ]; then
              settled=1
              break
            fi
            sleep 0.25
          done

          kill "$watch_pid" 2>/dev/null || true
          wait "$watch_pid" 2>/dev/null || true

          if [ -z "$settled" ]; then
            echo "expected the trigger to settle as Running with the annotation lease released"
            kubectl get httptrigger locking-httptrigger -n locking -o yaml
            exit 1
          fi

          # Some recorded version of the trigger must have carried the lease.
          if ! awk -F'|' '$1 == "locking-httptrigger" && $2 != "" { found = 1 } END { exit !found }' "$watch_file"; then
            echo "expected to observe the annotation lease being written and then cleared"
            echo "--- observed trigger versions (name|lock-timestamp|phase) ---"
            cat "$watch_file"
            echo "--- awk field dump ---"
            awk -F'|' '{ printf "line %d: nf=%d f1=[%s] f2=[%s] f3=[%s]\n", NR, NF, $1, $2, $3 }' "$watch_file"
            echo "--- current trigger ---"
            kubectl get httptrigger locking-httptrigger -n locking -o yaml
            exit 1
          fi
    - assert:
        resource:
          apiVersion: triggers.harikube.info/v1
          kind: HTTPTrigger
          metadata:
            name: locking-httptrigger
            namespace: locking
  - name: Hold an active lease and verify reconcile is requeued until expiry
    try:
    - script:
        content: |
          set -euo pipefail
          before_last="$(kubectl get httptrigger locking-httptrigger -n locking -o jsonpath='{.status.lastGeneration}')"
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          kubectl annotate httptrigger locking-httptrigger -n locking \
            triggers.harikube.info/lock-timestamp="${now}" --overwrite
          kubectl patch httptrigger locking-httptrigger -n locking --type=merge \
            -p '{"spec":{"method":"POST"}}'

          observed_requeue=""
          for _ in $(seq 1 12); do
            generation="$(kubectl get httptrigger locking-httptrigger -n locking -o jsonpath='{.metadata.generation}')"
            last_generation="$(kubectl get httptrigger locking-httptrigger -n locking -o jsonpath='{.status.lastGeneration}')"
            annotation="$(kubectl get httptrigger locking-httptrigger -n locking -o jsonpath='{.metadata.annotations.triggers\.harikube\.info/lock-timestamp}' 2>/dev/null || true)"
            if [ "$generation" != "$before_last" ] && [ "$last_generation" = "$before_last" ] && [ -n "$annotation" ]; then
              observed_requeue=1
              break
            fi
            sleep 0.5
          done
          if [ -z "$observed_requeue" ]; then
            echo "expected generation change to remain pending while the lease is active"
            kubectl get httptrigger locking-httptrigger -n locking -o yaml
            exit 1
          fi

          for _ in $(seq 1 40); do
            generation="$(kubectl get httptrigger locking-httptrigger -n locking -o jsonpath='{.metadata.generation}')"
            last_generation="$(kubectl get httptrigger locking-httptrigger -n locking -o jsonpath='{.status.lastGeneration}')"
            annotation="$(kubectl get httptrigger locking-httptrigger -n locking -o jsonpath='{.metadata.annotations.triggers\.harikube\.info/lock-timestamp}' 2>/dev/null || true)"
            if [ "$generation" = "$last_generation" ] && [ -z "$annotation" ]; then
              exit 0
            fi
            sleep 0.5
          done

          echo "expected reconcile to resume after the lease expired and clear the annotation"
          kubectl get httptrigger locking-httptrigger -n locking -o yaml
          exit 1
  - name: Cleanup test
    try:
    - delete:
        ref:
          apiVersion: v1
          kind: Namespace
          name: locking
