apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: trigger-update
spec:
  timeouts:
    exec: 3m
  skipDelete: true
  namespace: trigger-update
  steps:
  - name: Create HTTP server
    try:
    - apply:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: trigger-update-webhook
            namespace: trigger-update
            labels:
              app: nginx-trigger-update
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: nginx-trigger-update
            template:
              metadata:
                labels:
                  app: nginx-trigger-update
              spec:
                containers:
                - name: nginx
                  image: nginx:latest
                  ports:
                  - containerPort: 80
    - apply:
        resource:
          apiVersion: v1
          kind: Service
          metadata:
            name: nginx-trigger-update-service
            namespace: trigger-update
          spec:
            type: NodePort
            selector:
              app: nginx-trigger-update
            ports:
              - protocol: TCP
                port: 8892
                targetPort: 80
    - assert:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: trigger-update-webhook
            namespace: trigger-update
          status:
            readyReplicas: 1
  - name: Create HTTPTrigger watching Secrets
    try:
    - apply:
        resource:
          apiVersion: triggers.harikube.info/v1
          kind: HTTPTrigger
          metadata:
            name: trigger-update-test
            namespace: trigger-update
          spec:
            resource:
              apiVersion: v1
              kind: ConfigMap
            namespaces:
              - trigger-update
            labelSelectors:
              - "watch-e2e-update=true"
            eventTypes:
              - ADDED
            url:
              service:
                name: nginx-trigger-update-service
                namespace: trigger-update
                uri:
                  static: "/"
            method: GET
    - assert:
        resource:
          apiVersion: triggers.harikube.info/v1
          kind: HTTPTrigger
          metadata:
            name: trigger-update-test
            namespace: trigger-update
    - sleep:
        duration: 1s
  - name: Update the HTTPTrigger (change method) and assert new generation
    try:
    - patch:
        resource:
          apiVersion: triggers.harikube.info/v1
          kind: HTTPTrigger
          metadata:
            name: trigger-update-test
            namespace: trigger-update
          spec:
            method: POST
    - sleep:
        duration: 1s
  - name: Create matching ConfigMap and verify webhook is called with updated trigger
    try:
    - apply:
        resource:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: update-test-cm
            namespace: trigger-update
            labels:
              watch-e2e-update: "true"
    - sleep:
        duration: 5s
    - script:
        content: kubectl logs -n trigger-update -l app=nginx-trigger-update | grep 'Go-http-client/1.1'
  - name: Cleanup test
    try:
    - delete:
        ref:
          apiVersion: v1
          kind: Namespace
          name: trigger-update
