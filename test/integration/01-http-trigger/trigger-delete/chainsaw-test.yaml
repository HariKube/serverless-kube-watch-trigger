apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: trigger-delete
spec:
  timeouts:
    exec: 2m
  skipDelete: true
  namespace: trigger-delete
  steps:
  - name: Create HTTP server
    try:
    - apply:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: trigger-delete-webhook
            namespace: trigger-delete
            labels:
              app: nginx-trigger-delete
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: nginx-trigger-delete
            template:
              metadata:
                labels:
                  app: nginx-trigger-delete
              spec:
                containers:
                - name: nginx
                  image: nginx:latest
                  ports:
                  - containerPort: 80
    - apply:
        resource:
          apiVersion: v1
          kind: Service
          metadata:
            name: nginx-trigger-delete-service
            namespace: trigger-delete
          spec:
            type: NodePort
            selector:
              app: nginx-trigger-delete
            ports:
              - protocol: TCP
                port: 8893
                targetPort: 80
    - assert:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: trigger-delete-webhook
            namespace: trigger-delete
          status:
            readyReplicas: 1
  - name: Create HTTPTrigger and assert it starts
    try:
    - apply:
        resource:
          apiVersion: triggers.harikube.info/v1
          kind: HTTPTrigger
          metadata:
            name: trigger-delete-test
            namespace: trigger-delete
          spec:
            resource:
              apiVersion: v1
              kind: ConfigMap
            namespaces:
              - trigger-delete
            labelSelectors:
              - "watch-e2e-del=true"
            eventTypes:
              - MODIFIED
            url:
              service:
                name: nginx-trigger-delete-service
                namespace: trigger-delete
                uri:
                  static: "/"
            method: GET
    - assert:
        resource:
          apiVersion: triggers.harikube.info/v1
          kind: HTTPTrigger
          metadata:
            name: trigger-delete-test
            namespace: trigger-delete
    - sleep:
        duration: 1s
  - name: Delete the HTTPTrigger and create a matching ConfigMap – webhook must NOT be called
    try:
    - delete:
        ref:
          apiVersion: triggers.harikube.info/v1
          kind: HTTPTrigger
          name: trigger-delete-test
    - sleep:
        duration: 1s
    - apply:
        resource:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: del-test-cm
            namespace: trigger-delete
            labels:
              watch-e2e-del: "true"
    - sleep:
        duration: 5s
    - script:
        # Nginx must NOT have received any hits after trigger deletion.
        content: "! kubectl logs -n trigger-delete -l app=nginx-trigger-delete | grep 'Go-http-client/1.1'"
  - name: Cleanup test
    try:
    - delete:
        ref:
          apiVersion: v1
          kind: Namespace
          name: trigger-delete