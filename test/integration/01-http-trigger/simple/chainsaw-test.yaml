apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: simple
spec:
  timeouts:
    exec: 1m
  skipDelete: true
  namespace: simple
  steps:
  - name: Create HTTP server
    try:
    - apply:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: simple-http-trigger-webook
            namespace: simple
            labels:
              app: nginx
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: nginx
            template:
              metadata:
                labels:
                  app: nginx
              spec:
                containers:
                - name: nginx
                  image: nginx:latest
                  ports:
                  - containerPort: 80
    - apply:
        resource:
          apiVersion: v1
          kind: Service
          metadata:
            name: nginx-service
            namespace: simple
          spec:
            type: NodePort
            selector:
              app: nginx
            ports:
              - protocol: TCP
                port: 8888
                targetPort: 80
    - assert:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: simple-http-trigger-webook
            namespace: simple
          status:
            readyReplicas: 1
  - name: Create http trigger
    try:
    - apply:
        resource:
          apiVersion: triggers.harikube.info/v1
          kind: HTTPTrigger
          metadata:
            name: minimal-httptrigger-example
            namespace: simple
          spec:
            resource:
              apiVersion: apps/v1
              kind: Deployment
            url:
              service:
                name: nginx-service
                namespace: simple
                uri:
                  static: "/"
            method: GET
    - assert:
        resource:
          apiVersion: triggers.harikube.info/v1
          kind: HTTPTrigger
          metadata:
            name: minimal-httptrigger-example
            namespace: simple
    - sleep:
        duration: 1s
  - name: Validate webhook trigger  
    try:
    - script:
        content: |
          set -euo pipefail
          # Poll for the delivery: keep bumping a label on the operator's own
          # deployment (an app/v1 Deployment watched by the trigger) until the
          # webhook receives a request. This is resilient to the trigger's
          # watch not being fully established yet, which would otherwise race
          # a single patch and be missed permanently.
          for i in $(seq 1 8); do
            kubectl patch deployment serverless-kube-watch-trigger-controller-manager \
              -n serverless-kube-watch-trigger-system --type=merge \
              -p "{\"metadata\":{\"labels\":{\"trigger\":\"change-$i\"}}}" >/dev/null 2>&1 || true
            sleep 2
            if kubectl logs -n simple -l app=nginx | grep -q 'Go-http-client/1.1'; then
              exit 0
            fi
          done
          echo "webhook was not triggered"
          kubectl logs -n simple -l app=nginx | tail -20
          exit 1
  - name: Cleanup test
    try:
    - delete:
        ref:
          apiVersion: v1
          kind: Namespace
          name: simple