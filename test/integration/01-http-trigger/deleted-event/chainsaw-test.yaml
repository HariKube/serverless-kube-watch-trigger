apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: deleted-event
spec:
  timeouts:
    exec: 2m
  skipDelete: true
  namespace: deleted-event
  steps:
  - name: Create HTTP server
    try:
    - apply:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: deleted-event-webhook
            namespace: deleted-event
            labels:
              app: nginx-deleted
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: nginx-deleted
            template:
              metadata:
                labels:
                  app: nginx-deleted
              spec:
                containers:
                - name: nginx
                  image: nginx:latest
                  ports:
                  - containerPort: 80
    - apply:
        resource:
          apiVersion: v1
          kind: Service
          metadata:
            name: nginx-deleted-service
            namespace: deleted-event
          spec:
            type: NodePort
            selector:
              app: nginx-deleted
            ports:
              - protocol: TCP
                port: 8890
                targetPort: 80
    - assert:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: deleted-event-webhook
            namespace: deleted-event
          status:
            readyReplicas: 1
  - name: Create watched ConfigMap and HTTPTrigger
    try:
    - apply:
        resource:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: watched-cm-deleted
            namespace: deleted-event
            labels:
              watch-e2e-deleted: "true"
    - apply:
        resource:
          apiVersion: triggers.harikube.info/v1
          kind: HTTPTrigger
          metadata:
            name: deleted-event-trigger
            namespace: deleted-event
          spec:
            resource:
              apiVersion: v1
              kind: ConfigMap
            namespaces:
              - deleted-event
            labelSelectors:
              - "watch-e2e-deleted=true"
            eventTypes:
              - DELETED
            url:
              service:
                name: nginx-deleted-service
                namespace: deleted-event
                uri:
                  static: "/"
            method: GET
    - assert:
        resource:
          apiVersion: triggers.harikube.info/v1
          kind: HTTPTrigger
          metadata:
            name: deleted-event-trigger
            namespace: deleted-event
    - sleep:
        duration: 1s
  - name: Delete watched ConfigMap and validate webhook call
    try:
    - delete:
        ref:
          apiVersion: v1
          kind: ConfigMap
          name: watched-cm-deleted
          namespace: deleted-event
    - sleep:
        duration: 5s
    - script:
        content: kubectl logs -n deleted-event -l app=nginx-deleted | grep 'Go-http-client/1.1'
  - name: Cleanup test
    try:
    - delete:
        ref:
          apiVersion: v1
          kind: Namespace
          name: deleted-event