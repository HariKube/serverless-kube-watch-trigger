apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: modified-event
spec:
  timeouts:
    exec: 2m
  skipDelete: true
  namespace: modified-event
  steps:
  - name: Create HTTP server
    try:
    - apply:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: modified-event-webhook
            namespace: modified-event
            labels:
              app: nginx-modified
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: nginx-modified
            template:
              metadata:
                labels:
                  app: nginx-modified
              spec:
                containers:
                - name: nginx
                  image: nginx:latest
                  ports:
                  - containerPort: 80
    - apply:
        resource:
          apiVersion: v1
          kind: Service
          metadata:
            name: nginx-modified-service
            namespace: modified-event
          spec:
            type: NodePort
            selector:
              app: nginx-modified
            ports:
              - protocol: TCP
                port: 8889
                targetPort: 80
    - assert:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: modified-event-webhook
            namespace: modified-event
          status:
            readyReplicas: 1
  - name: Create watched ConfigMap and HTTPTrigger
    try:
    - apply:
        resource:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: watched-cm-modified
            namespace: modified-event
            labels:
              watch-e2e-modified: "true"
    - apply:
        resource:
          apiVersion: triggers.harikube.info/v1
          kind: HTTPTrigger
          metadata:
            name: modified-event-trigger
            namespace: modified-event
          spec:
            resource:
              apiVersion: v1
              kind: ConfigMap
            namespaces:
              - modified-event
            labelSelectors:
              - "watch-e2e-modified=true"
            eventTypes:
              - MODIFIED
            url:
              service:
                name: nginx-modified-service
                namespace: modified-event
                uri:
                  static: "/"
            method: GET
    - assert:
        resource:
          apiVersion: triggers.harikube.info/v1
          kind: HTTPTrigger
          metadata:
            name: modified-event-trigger
            namespace: modified-event
    - sleep:
        duration: 1s
  - name: Trigger MODIFIED event and validate webhook call
    try:
    - patch:
        resource:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: watched-cm-modified
            namespace: modified-event
            annotations:
              trigger: "modified"
    - sleep:
        duration: 5s
    - script:
        content: kubectl logs -n modified-event -l app=nginx-modified | grep 'Go-http-client/1.1'
  - name: Cleanup test
    try:
    - delete:
        ref:
          apiVersion: v1
          kind: Namespace
          name: modified-event