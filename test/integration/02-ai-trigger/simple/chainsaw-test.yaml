apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: simple-pi-trigger
spec:
  timeouts:
    exec: 6m
  skipDelete: true
  namespace: pi-trigger-simple
  steps:
  - name: Prepare namespace
    try:
    - script:
        content: |
          kubectl delete namespace pi-trigger-simple --ignore-not-found=true --wait=true || true
          kubectl create namespace pi-trigger-simple --dry-run=client -o yaml | kubectl apply -f -
  - name: Create PiTrigger
    try:
    - script:
        content: |
          set -euo pipefail
          IMAGE="docker.io/mhmxs/pi-agent-empty:latest"

          # Create a Secret containing the current kubeconfig at data.kubeconfig for the watcher
          KUBECONFIG_B64="$(kubectl config view --raw | base64 | tr -d '\n')"

          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: Secret
          metadata:
            name: pi-watcher-kubeconfig
            namespace: pi-trigger-simple
          data:
            kubeconfig: ${KUBECONFIG_B64}
          ---
          apiVersion: v1
          kind: Secret
          metadata:
            name: pi-agent-config
            namespace: pi-trigger-simple
          stringData:
            settings.json: '{"provider":"test"}'
            models.json: '[]'
            models-store.json: '{}'
            auth.json: '{}'
          ---
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: pi-agent-prompts
            namespace: pi-trigger-simple
          data:
            review.md: |
              Review prompt.
          ---
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: pi-agent-skills
            namespace: pi-trigger-simple
          data:
            SKILL.md: |
              # skill
          ---
          apiVersion: triggers.harikube.info/v1
          kind: PiTrigger
          metadata:
            name: pi-trigger-simple
            namespace: pi-trigger-simple
          spec:
            resource:
              apiVersion: v1
              kind: ConfigMap
            namespaces:
            - pi-trigger-simple
            labelSelectors:
            - watch-e2e-pi=true
            eventTypes:
            - ADDED
            agent:
              image: ${IMAGE}
              configSecretRef:
                name: pi-agent-config
              promptsConfigMapRef:
                name: pi-agent-prompts
              skillsConfigMapRef:
                name: pi-agent-skills
              # Provide a custom prompt prefix to verify the controller forwards it via -p
              prompt: "E2E-TEST-PROMPT: please prefix this payload"
              workingDir: /
              noExtensions: true
              backoffLimit: 0
              ttlSecondsAfterFinished: 60
            watcherKubeconfigSecret:
              name: pi-watcher-kubeconfig
          EOF
    - assert:
        resource:
          apiVersion: triggers.harikube.info/v1
          kind: PiTrigger
          metadata:
            name: pi-trigger-simple
            namespace: pi-trigger-simple
  - name: Create watched ConfigMap
    try:
    - apply:
        resource:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: pi-trigger-source
            namespace: pi-trigger-simple
            labels:
              watch-e2e-pi: "true"
          data:
            key: value
  - name: Validate Job execution wiring
    try:
    - script:
        content: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            JOB_NAME="$(kubectl get jobs -n pi-trigger-simple -l triggers.harikube.info/pitrigger-name=pi-trigger-simple -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
            POD_NAME=""
            JOB_ARGS=""
            if [ -n "$JOB_NAME" ]; then
              POD_NAME="$(kubectl get pods -n pi-trigger-simple -l job-name=${JOB_NAME} -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
              JOB_ARGS="$(kubectl get job "$JOB_NAME" -n pi-trigger-simple -o jsonpath='{.spec.template.spec.containers[0].args}' 2>/dev/null || true)"
            fi

            if [ -n "$JOB_NAME" ] \
              && [ -n "$POD_NAME" ] \
              && ! printf '%s' "$JOB_ARGS" | grep -q -- '--no-session' \
              && printf '%s' "$JOB_ARGS" | grep -q -- '--mode' \
              && printf '%s' "$JOB_ARGS" | grep -q -- 'E2E-TEST-PROMPT'; then
              kubectl get pitrigger pi-trigger-simple -n pi-trigger-simple -o yaml
              kubectl get job "$JOB_NAME" -n pi-trigger-simple -o yaml
              kubectl get pod "$POD_NAME" -n pi-trigger-simple -o yaml
              exit 0
            fi

            sleep 2
          done

          echo "expected PiTrigger job execution details were not observed"
          kubectl get pitrigger pi-trigger-simple -n pi-trigger-simple -o yaml || true
          kubectl get jobs -n pi-trigger-simple -o wide || true
          kubectl get pods -n pi-trigger-simple -o wide || true
          exit 1
  - name: Pause controller and create an already-expired PiTrigger
    try:
    - script:
        content: |
          set -euo pipefail
          NS="pi-trigger-simple"
          CONTROLLER_NS="serverless-kube-watch-trigger-system"
          CONTROLLER="serverless-kube-watch-trigger-controller-manager"
          TRIGGER_NAME="pi-trigger-session-timeout"

          trap 'rc=$?; if [ "$rc" -ne 0 ]; then kubectl scale deployment ${CONTROLLER} -n ${CONTROLLER_NS} --replicas=1 || true; fi; exit "$rc"' EXIT
          kubectl scale deployment ${CONTROLLER} -n ${CONTROLLER_NS} --replicas=0
          for _ in $(seq 1 60); do
            PODS="$(kubectl get pods -n ${CONTROLLER_NS} -l control-plane=controller-manager -o name 2>/dev/null || true)"
            [ -z "${PODS}" ] && break
            sleep 2
          done
          [ -z "$(kubectl get pods -n ${CONTROLLER_NS} -l control-plane=controller-manager -o name 2>/dev/null || true)" ]

          cat <<EOF | kubectl apply -f -
          apiVersion: triggers.harikube.info/v1
          kind: PiTrigger
          metadata:
            name: ${TRIGGER_NAME}
            namespace: ${NS}
            finalizers:
            - tests.harikube.io/cleanup
          spec:
            timeout: 15s
            resource:
              apiVersion: v1
              kind: ConfigMap
            namespaces:
            - ${NS}
            agent:
              image: docker.io/mhmxs/pi-agent-empty:latest
              configSecretRef:
                name: pi-agent-config
              promptsConfigMapRef:
                name: pi-agent-prompts
              skillsConfigMapRef:
                name: pi-agent-skills
              workingDir: /
              noExtensions: true
              backoffLimit: 0
              ttlSecondsAfterFinished: 60
          EOF

          # The controller is stopped for longer than spec.timeout, so its first
          # reconciliation must enforce timeout from creationTimestamp.
          sleep 25
  - name: Restore controller and validate already-expired timeout dispatch
    try:
    - script:
        content: |
          set -euo pipefail
          NS="pi-trigger-simple"
          CONTROLLER_NS="serverless-kube-watch-trigger-system"
          CONTROLLER="serverless-kube-watch-trigger-controller-manager"
          TRIGGER_NAME="pi-trigger-session-timeout"

          restore_controller() {
            kubectl scale deployment ${CONTROLLER} -n ${CONTROLLER_NS} --replicas=1 || true
            kubectl rollout status deployment/${CONTROLLER} -n ${CONTROLLER_NS} --timeout=180s || true
          }
          trap restore_controller EXIT
          restore_controller

          for _ in $(seq 1 90); do
            DELETION_TS="$(kubectl get pitrigger ${TRIGGER_NAME} -n ${NS} -o jsonpath='{.metadata.deletionTimestamp}' 2>/dev/null || true)"
            FINALIZERS="$(kubectl get pitrigger ${TRIGGER_NAME} -n ${NS} -o jsonpath='{.metadata.finalizers}' 2>/dev/null || true)"
            JOB_NAME="$(kubectl get jobs -n ${NS} -l triggers.harikube.info/pitrigger-name=${TRIGGER_NAME} -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
            if [ -z "${DELETION_TS}" ] || ! printf '%s' "${FINALIZERS}" | grep -q 'tests.harikube.io/cleanup' || [ -z "${JOB_NAME}" ]; then
              sleep 2
              continue
            fi

            INPUT_B64="$(kubectl get job ${JOB_NAME} -n ${NS} -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="PI_TRIGGER_INPUT_BASE64")].value}' 2>/dev/null || true)"
            RESOURCE_VERSION="$(kubectl get job ${JOB_NAME} -n ${NS} -o jsonpath='{.metadata.annotations.triggers\.harikube\.info/resource-version}' 2>/dev/null || true)"
            INPUT_JSON="$(printf '%s' "${INPUT_B64}" | base64 -d 2>/dev/null || true)"

            if [ -n "${INPUT_B64}" ] && [ -n "${RESOURCE_VERSION}" ] \
              && printf '%s' "${INPUT_JSON}" | grep -q '"eventType":"DELETED"' \
              && printf '%s' "${INPUT_JSON}" | grep -q 'trigger session timed out' \
              && printf '%s' "${INPUT_JSON}" | grep -q "trigger=${NS}/${TRIGGER_NAME}" \
              && printf '%s' "${INPUT_JSON}" | grep -q "job=${JOB_NAME}" \
              && printf '%s' "${INPUT_JSON}" | grep -q "resourceVersion=${RESOURCE_VERSION}"; then
              kubectl get pitrigger ${TRIGGER_NAME} -n ${NS} -o yaml
              kubectl get job ${JOB_NAME} -n ${NS} -o yaml
              exit 0
            fi

            sleep 2
          done

          echo "expected an already-expired PiTrigger to retain its finalizer-protected deletion state and dispatch a deleted-event timeout job with identifying metadata"
          kubectl get pitrigger ${TRIGGER_NAME} -n ${NS} -o yaml || true
          kubectl get jobs -n ${NS} -o yaml || true
          kubectl get configmaps -n ${NS} -o yaml || true
          exit 1
  - name: Cleanup timeout scenario
    try:
    - script:
        content: |
          set -euo pipefail
          NS="pi-trigger-simple"
          kubectl patch pitrigger pi-trigger-session-timeout -n ${NS} --type=merge -p '{"metadata":{"finalizers":[]}}' || true
          kubectl delete namespace ${NS} --ignore-not-found=true --wait=true || true
          kubectl scale deployment serverless-kube-watch-trigger-controller-manager -n serverless-kube-watch-trigger-system --replicas=1 || true
