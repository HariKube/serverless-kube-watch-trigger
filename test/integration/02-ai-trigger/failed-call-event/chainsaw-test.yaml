apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: failed-ai-call-event
spec:
  timeouts:
    exec: 3m
  skipDelete: true
  namespace: ai-trigger-failure
  steps:
  - name: Enable trigger call events
    try:
  - name: Deploy failing AI mock server
    try:
    - apply:
        resource:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: failing-ai-mock-server
            namespace: ai-trigger-failure
          data:
            server.py: |
              from http.server import BaseHTTPRequestHandler, HTTPServer

              class Handler(BaseHTTPRequestHandler):
                  def do_POST(self):
                      self.send_response(500)
                      self.send_header("Content-Type", "application/json")
                      self.end_headers()
                      self.wfile.write(b'{"error":"failure"}')

                  def log_message(self, format, *args):
                      return

              HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
    - apply:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: failing-ai-mock
            namespace: ai-trigger-failure
            labels:
              app: failing-ai-mock
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: failing-ai-mock
            template:
              metadata:
                labels:
                  app: failing-ai-mock
              spec:
                containers:
                - name: server
                  image: python:3.12-alpine
                  command:
                  - python
                  - /app/server.py
                  ports:
                  - containerPort: 8080
                  volumeMounts:
                  - name: script
                    mountPath: /app
                volumes:
                - name: script
                  configMap:
                    name: failing-ai-mock-server
    - apply:
        resource:
          apiVersion: v1
          kind: Service
          metadata:
            name: failing-ai-mock
            namespace: ai-trigger-failure
          spec:
            selector:
              app: failing-ai-mock
            ports:
            - name: http
              port: 8080
              targetPort: 8080
    - assert:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: failing-ai-mock
            namespace: ai-trigger-failure
          status:
            readyReplicas: 1
  - name: Create AITrigger
    try:
    - apply:
        resource:
          apiVersion: triggers.harikube.info/v1
          kind: AITrigger
          metadata:
            name: ai-trigger-failure
            namespace: ai-trigger-failure
          spec:
            resource:
              apiVersion: v1
              kind: ConfigMap
            namespaces:
            - ai-trigger-failure
            labelSelectors:
            - watch-e2e-ai-fail=true
            eventTypes:
            - ADDED
            url:
              service:
                name: failing-ai-mock
                namespace: ai-trigger-failure
                portName: http
                uri:
                  static: /v1/chat/completions
            method: POST
            delivery:
              timeout: 2s
              retries: 1
            request:
              model: gpt-4o-mini
              promptTemplate: |
                Summarize {{ .metadata.name }} in namespace {{ .metadata.namespace }}
    - assert:
        resource:
          apiVersion: triggers.harikube.info/v1
          kind: AITrigger
          metadata:
            name: ai-trigger-failure
            namespace: ai-trigger-failure
  - name: Create watched ConfigMap
    try:
    - apply:
        resource:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: ai-trigger-failure-source
            namespace: ai-trigger-failure
            labels:
              watch-e2e-ai-fail: "true"
          data:
            key: value
  - name: Validate failure status and event
    try:
    - script:
        content: |
          set -euo pipefail
          for _ in $(seq 1 40); do
            ERROR_REASON="$(kubectl get aitrigger ai-trigger-failure -n ai-trigger-failure -o jsonpath='{.status.errorReason}' || true)"
            EVENT_OUTPUT="$(kubectl get events -n ai-trigger-failure \
              --field-selector involvedObject.kind=AITrigger,involvedObject.name=ai-trigger-failure,reason=TriggerCallFailed \
              -o jsonpath='{range .items[*]}{.type}{"|"}{.reason}{"|"}{.message}{"\n"}{end}')"
            if [ -n "$ERROR_REASON" ] && printf '%s' "$EVENT_OUTPUT" | grep -q 'Warning|TriggerCallFailed'; then
              printf '%s\n' "$ERROR_REASON" | grep 'status code is 500'
              printf '%s\n' "$EVENT_OUTPUT" | grep 'status code is 500'
              exit 0
            fi
            sleep 2
          done
          echo "expected failure status or event not found"
          kubectl get aitrigger ai-trigger-failure -n ai-trigger-failure -o yaml
          kubectl get events -n ai-trigger-failure --sort-by=.lastTimestamp
          exit 1
