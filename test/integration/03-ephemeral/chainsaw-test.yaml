apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: controller-driven-pitrigger-timeout-deletion
spec:
  timeouts:
    exec: 4m
  skipDelete: true
  namespace: ephemeral-pitrigger-timeout
  steps:
  - name: Prepare PiTrigger timeout deletion namespace
    try:
    - script:
        content: |
          kubectl delete namespace ephemeral-pitrigger-timeout --ignore-not-found=true --wait=true || true
          kubectl create namespace ephemeral-pitrigger-timeout --dry-run=client -o yaml | kubectl apply -f -
  - name: Create PiTrigger with top-level timeout fixture
    try:
    - script:
        content: |
          set -euo pipefail
          IMAGE="docker.io/mhmxs/pi-agent-empty:latest"
          NS="ephemeral-pitrigger-timeout"
          TRIGGER_NAME="ephemeral-pi-trigger-timeout"

          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: Secret
          metadata:
            name: pi-agent-config
            namespace: ${NS}
          stringData:
            settings.json: '{"provider":"test"}'
            models.json: '[]'
            models-store.json: '{}'
            auth.json: '{}'
          ---
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: pi-agent-prompts
            namespace: ${NS}
          data:
            review.md: |
              Review prompt.
          ---
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: pi-agent-skills
            namespace: ${NS}
          data:
            SKILL.md: |
              # skill
          ---
          apiVersion: triggers.harikube.info/v1
          kind: PiTrigger
          metadata:
            name: ${TRIGGER_NAME}
            namespace: ${NS}
            finalizers:
            - tests.harikube.io/cleanup
          spec:
            timeout: 15s
            resource:
              apiVersion: v1
              kind: ConfigMap
            namespaces:
            - ${NS}
            agent:
              image: ${IMAGE}
              configSecretRef:
                name: pi-agent-config
              promptsConfigMapRef:
                name: pi-agent-prompts
              skillsConfigMapRef:
                name: pi-agent-skills
              workingDir: /
              noExtensions: true
              backoffLimit: 0
              ttlSecondsAfterFinished: 60
          EOF
    - assert:
        resource:
          apiVersion: triggers.harikube.info/v1
          kind: PiTrigger
          metadata:
            name: ephemeral-pi-trigger-timeout
            namespace: ephemeral-pitrigger-timeout
  - name: Validate controller marks PiTrigger for deletion and dispatches timeout job metadata
    try:
    - script:
        content: |
          set -euo pipefail
          NS="ephemeral-pitrigger-timeout"
          TRIGGER_NAME="ephemeral-pi-trigger-timeout"

          for _ in $(seq 1 90); do
            DELETION_TS="$(kubectl get pitrigger ${TRIGGER_NAME} -n ${NS} -o jsonpath='{.metadata.deletionTimestamp}' 2>/dev/null || true)"
            FINALIZERS="$(kubectl get pitrigger ${TRIGGER_NAME} -n ${NS} -o jsonpath='{.metadata.finalizers}' 2>/dev/null || true)"
            JOB_NAME="$(kubectl get jobs -n ${NS} -l triggers.harikube.info/pitrigger-name=${TRIGGER_NAME} -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
            if [ -z "${DELETION_TS}" ] || ! printf '%s' "${FINALIZERS}" | grep -q 'tests.harikube.io/cleanup' || [ -z "${JOB_NAME}" ]; then
              sleep 2
              continue
            fi

            INPUT_B64="$(kubectl get job ${JOB_NAME} -n ${NS} -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="PI_TRIGGER_INPUT_BASE64")].value}' 2>/dev/null || true)"
            RESOURCE_VERSION="$(kubectl get job ${JOB_NAME} -n ${NS} -o jsonpath='{.metadata.annotations.triggers\.harikube\.info/resource-version}' 2>/dev/null || true)"
            INPUT_JSON="$(printf '%s' "${INPUT_B64}" | base64 -d 2>/dev/null || true)"

            if [ -n "${INPUT_B64}" ] && [ -n "${RESOURCE_VERSION}" ] \
              && printf '%s' "${INPUT_JSON}" | grep -q '"eventType":"DELETED"' \
              && printf '%s' "${INPUT_JSON}" | grep -q 'trigger session timed out' \
              && printf '%s' "${INPUT_JSON}" | grep -q "trigger=${NS}/${TRIGGER_NAME}" \
              && printf '%s' "${INPUT_JSON}" | grep -q "job=${JOB_NAME}" \
              && printf '%s' "${INPUT_JSON}" | grep -q "resourceVersion=${RESOURCE_VERSION}"; then
              kubectl get pitrigger ${TRIGGER_NAME} -n ${NS} -o yaml
              kubectl get job ${JOB_NAME} -n ${NS} -o yaml
              exit 0
            fi

            sleep 2
          done

          echo "expected the controller-driven PiTrigger timeout path to set deletionTimestamp and dispatch a deleted-event timeout job with identifying metadata for trigger session timed out"
          kubectl get pitrigger ${TRIGGER_NAME} -n ${NS} -o yaml || true
          kubectl get jobs -n ${NS} -o yaml || true
          kubectl get configmaps -n ${NS} -o yaml || true
          exit 1
  - name: Cleanup PiTrigger timeout deletion test
    try:
    - script:
        content: |
          set -euo pipefail
          NS="ephemeral-pitrigger-timeout"
          TRIGGER_NAME="ephemeral-pi-trigger-timeout"
          kubectl patch pitrigger ${TRIGGER_NAME} -n ${NS} --type=merge -p '{"metadata":{"finalizers":[]}}' || true
          kubectl delete namespace ${NS} --ignore-not-found=true --wait=true || true
