apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: distributed-partition
spec:
  timeouts:
    exec: 8m
  skipDelete: true
  namespace: scaling
  steps:
  - name: Prepare distributed-mode RBAC and policy
    try:
    - apply:
        resource:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            name: serverless-kube-watch-trigger-distributed-role
          rules:
          - apiGroups:
            - ""
            resources:
            - configmaps
            verbs:
            - get
            - list
            - watch
            - create
            - update
            - patch
    - apply:
        resource:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: serverless-kube-watch-trigger-distributed-rolebinding
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: serverless-kube-watch-trigger-distributed-role
          subjects:
          - kind: ServiceAccount
            name: serverless-kube-watch-trigger-controller-manager
            namespace: serverless-kube-watch-trigger-system
  - name: Switch operator to distributed mode and scale replicas
    try:
    - script:
        content: |
          set -euo pipefail
          patch=$(cat <<'EOF'
          {
            "spec": {
              "replicas": 3,
              "template": {
                "spec": {
                  "containers": [
                    {
                      "name": "manager",
                      "args": [
                        "--enable-leader-election=false",
                        "--health-probe-bind-address=:8081"
                      ],
                      "env": [
                        {
                          "name": "POD_NAME",
                          "valueFrom": {
                            "fieldRef": {
                              "fieldPath": "metadata.name"
                            }
                          }
                        },
                        {
                          "name": "POD_NAMESPACE",
                          "valueFrom": {
                            "fieldRef": {
                              "fieldPath": "metadata.namespace"
                            }
                          }
                        }
                      ]
                    }
                  ]
                }
              }
            }
          }
          EOF
          )
          kubectl patch deployment serverless-kube-watch-trigger-controller-manager \
            -n serverless-kube-watch-trigger-system \
            --type=strategic \
            -p "$patch"
          kubectl rollout status deployment/serverless-kube-watch-trigger-controller-manager \
            -n serverless-kube-watch-trigger-system --timeout=300s
          kubectl wait --for=jsonpath='{.status.readyReplicas}'=3 \
            deployment/serverless-kube-watch-trigger-controller-manager \
            -n serverless-kube-watch-trigger-system --timeout=300s
    # This step pre-scales the operator to three replicas as a test prerequisite.
    # The replica count must be restored even when a later step fails: leftover
    # replicas make every later suite run against an image and topology it did not ask for.
    # The distributed rolebinding cleanup is performed below as well.
    finally:
    - script:
        content: |
          set -uo pipefail
          kubectl delete clusterrolebinding \
            serverless-kube-watch-trigger-distributed-rolebinding --ignore-not-found
          kubectl delete clusterrole \
            serverless-kube-watch-trigger-distributed-role --ignore-not-found
          kubectl patch deployment serverless-kube-watch-trigger-controller-manager \
            -n serverless-kube-watch-trigger-system --type:strategic \
            -p '{"spec":{"replicas":1,"template":{"spec":{"containers":[{"name":"manager","args":["--leader-elect","--health-probe-bind-address=:8081"]}]}}}}'
          kubectl rollout status deployment/serverless-kube-watch-trigger-controller-manager \
            -n serverless-kube-watch-trigger-system --timeout=300s
  - name: Create webhook backend
    try:
    - apply:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: scaling-http-trigger-webhook
            namespace: scaling
            labels:
              app: scaling-nginx
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: scaling-nginx
            template:
              metadata:
                labels:
                  app: scaling-nginx
              spec:
                containers:
                - name: nginx
                  image: nginx:latest
                  ports:
                  - containerPort: 80
    - apply:
        resource:
          apiVersion: v1
          kind: Service
          metadata:
            name: scaling-nginx-service
            namespace: scaling
          spec:
            type: NodePort
            selector:
              app: scaling-nginx
            ports:
            - protocol: TCP
              port: 8893
              targetPort: 80
    - script:
        content: |
          set -euo pipefail
          kubectl rollout status deployment/scaling-http-trigger-webhook \
            -n scaling --timeout=180s
    - assert:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: scaling-http-trigger-webhook
            namespace: scaling
          status:
            readyReplicas: 1
  - name: Create distributed HTTPTrigger
    try:
    - apply:
        resource:
          apiVersion: triggers.harikube.info/v1
          kind: HTTPTrigger
          metadata:
            name: scaling-httptrigger
            namespace: scaling
            labels:
              triggers.harikube.info/distribution: item-1

          spec:
            resource:
              apiVersion: v1
              kind: ConfigMap
            namespaces:
            - scaling
            labelSelectors:
            - scale-test=true
            eventTypes:
            - ADDED
            url:
              service:
                name: scaling-nginx-service
                namespace: scaling
                uri:
                  template: "/?name={{ .metadata.name }}"
            method: GET
    - assert:
        resource:
          apiVersion: triggers.harikube.info/v1
          kind: HTTPTrigger
          metadata:
            name: scaling-httptrigger
            namespace: scaling
    - script:
        content: |
          set -euo pipefail
          for _ in $(seq 1 90); do
            phase=$(kubectl get httptrigger scaling-httptrigger -n scaling \
              -o jsonpath='{.status.phase}' 2>/dev/null || true)
            dist=$(kubectl get httptrigger scaling-httptrigger -n scaling \
              -o go-template='{{ index .metadata.labels "triggers.harikube.info/distribution" }}' 2>/dev/null || true)
            if [ "$phase" = "Running" ] && [ -n "$dist" ] && printf '%s' "$dist" | grep -q '^item-'; then
              exit 0
            fi
            sleep 2
          done
          kubectl get httptrigger scaling-httptrigger -n scaling -o yaml
          kubectl get configmap distribution-partition-map \
            -n serverless-kube-watch-trigger-system -o yaml || true
          exit 1
  - name: Create the first batch of ConfigMaps and ensure they reconcile
    try:
    - script:
        content: |
          set -euo pipefail

          for i in $(seq 1 10); do
            cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: scale-a-$i
            namespace: scaling
            labels:
              scale-test: "true"
          data:
            batch: first
            index: "$i"
          EOF
          done

          for i in $(seq 1 10); do
            name="scale-a-$i"
            delivered=false
            for _ in $(seq 1 60); do
              if kubectl logs -n scaling deployment/scaling-http-trigger-webhook 2>/dev/null \
                | grep -Fq "GET /?name=$name HTTP/1.1\" 200"; then
                delivered=true
                break
              fi
              sleep 2
            done
            if [ "$delivered" != true ]; then
              echo "missing successful delivery for $name"
              kubectl get httptrigger scaling-httptrigger -n scaling -o yaml || true
              kubectl get configmap "$name" -n scaling -o yaml || true
              kubectl logs -n scaling deployment/scaling-http-trigger-webhook || true
              kubectl logs -n serverless-kube-watch-trigger-system \
                -l control-plane=controller-manager --tail=200 || true
              exit 1
            fi
          done
  - name: Wipe partition state, immediately create the second batch, and ensure all reconcile
    try:
    - script:
        content: |
          set -euo pipefail
          ns=serverless-kube-watch-trigger-system
          cm=distribution-partition-map

          for _ in $(seq 1 120); do
            if kubectl get configmap "$cm" -n "$ns" >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          kubectl get configmap "$cm" -n "$ns" >/dev/null 2>&1

          kubectl patch configmap "$cm" -n "$ns" --type=json \
            -p '[{"op": "replace", "path": "/data", "value": {}}]'

          for i in $(seq 1 10); do
            cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: scale-b-$i
            namespace: scaling
            labels:
              scale-test: "true"
          data:
            batch: second
            index: "$i"
          EOF
          done

          # Successful delivery of every second-batch ConfigMap is the actual
          # resilience requirement. Keep the partition map as diagnostic output,
          # but do not fail only because ownership redistribution is not yet
          # reflected the way this test originally expected.
          kubectl get configmap "$cm" -n "$ns" -o yaml || true

          for i in $(seq 1 10); do
            name="scale-b-$i"
            delivered=false
            for _ in $(seq 1 90); do
              if kubectl logs -n scaling deployment/scaling-http-trigger-webhook 2>/dev/null \
                | grep -Fq "GET /?name=$name HTTP/1.1\" 200"; then
                delivered=true
                break
              fi
              sleep 2
            done
            if [ "$delivered" != true ]; then
              echo "missing successful delivery for $name after partition-map wipe"
              kubectl get httptrigger scaling-httptrigger -n scaling -o yaml || true
              kubectl get configmap "$name" -n scaling -o yaml || true
              kubectl get configmap "$cm" -n "$ns" -o yaml || true
              kubectl logs -n scaling deployment/scaling-http-trigger-webhook || true
              kubectl logs -n serverless-kube-watch-trigger-system \
                -l control-plane=controller-manager --tail=200 || true
              exit 1
            fi
          done
  - name: Cleanup test resources
    try:
    - delete:
        ref:
          apiVersion: v1
          kind: Namespace
          name: scaling
    - script:
        content: |
          set -euo pipefail
          kubectl delete clusterrolebinding serverless-kube-watch-trigger-distributed-rolebinding \
            --ignore-not-found=true
          kubectl delete clusterrole serverless-kube-watch-trigger-distributed-role \
            --ignore-not-found=true
