apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: operator
spec:
  timeouts:
    exec: 5m
  namespace: default
  skipDelete: true
  steps:
  - name: Build operator
    try:
    - script:
        content: make -C ../../../.. package docker-build docker-load deploy
  - name: Verify PiTrigger rollout
    try:
    - script:
        content: |-
          set -euo pipefail
          # Bounded rollout check: wait for the rollout to finish, then ensure one ready replica.
          kubectl -n serverless-kube-watch-trigger-system rollout status deployment/serverless-kube-watch-trigger-controller-manager --timeout=2m
          # Some API servers return an empty status object briefly; poll for readyReplicas=1 with a bounded timeout.
          TIMEOUT=120
          INTERVAL=2
          ELAPSED=0
          while true; do
            readyReplicas=$(kubectl -n serverless-kube-watch-trigger-system get deployment serverless-kube-watch-trigger-controller-manager -o jsonpath='{.status.readyReplicas}' 2>/dev/null || true)
            if [ "${readyReplicas}" = "1" ]; then
              echo "Deployment has 1 ready replica"
              break
            fi
            if [ $ELAPSED -ge $TIMEOUT ]; then
              echo "Timed out waiting for readyReplicas=1" >&2
              kubectl -n serverless-kube-watch-trigger-system get deployment serverless-kube-watch-trigger-controller-manager -o yaml || true
              exit 1
            fi
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done
  - name: Configure extra RBAC
    try:
    - apply:
        resource:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: serverless-kube-watch-trigger-rolebinding
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: serverless-kube-watch-trigger-role
          subjects:
          - kind: ServiceAccount
            name: serverless-kube-watch-trigger-controller-manager
            namespace: serverless-kube-watch-trigger-system
    - apply:
        resource:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            name: serverless-kube-watch-trigger-role
          rules:
          - apiGroups:
            - ""
            resources:
            - configmaps
            - secrets
            verbs:
            - get
            - list
            - watch
          - apiGroups:
            - "apps"
            resources:
            - deployments
            verbs:
            - get
            - list
            - watch
