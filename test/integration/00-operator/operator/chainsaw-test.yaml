apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: operator
spec:
  timeouts:
    exec: 5m
  namespace: default
  skipDelete: true
  steps:
  - name: Build operator
    try:
    - script:
        content: make -C ../../../.. package docker-build docker-load
  - name: Deploy operator
    try:
    - script:
        content: kubectl apply -f ../../../../package/bundle-${TAG}.yaml
    - assert:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: serverless-kube-watch-trigger-controller-manager 
            namespace: serverless-kube-watch-trigger-system
          status:
            readyReplicas: 1
