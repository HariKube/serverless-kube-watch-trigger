apiVersion: triggers.harikube.info/v1
kind: PiTrigger
metadata:
  name: deployment-zero-available-replicas
  namespace: default
spec:
  resource:
    apiVersion: apps/v1
    kind: Deployment
  namespaces:
    - default
  eventTypes:
    - ADDED
    - MODIFIED
  eventFilter: 'not .status.availableReplicas'
  concurrency: 1
  maxJobs: 2
  sendInitialEvents: false
  timeout: 24h
  lockDuration: 45s
  env:
  - name: PI_OFFLINE
    value: "false"
  agent:
    image: docker.io/mhmxs/pi-agent-empty:latest
    configSecretRef:
      name: pi-agent-config
    promptsConfigMapRef:
      name: pi-agent-prompts
    skillsConfigMapRef:
      name: pi-agent-skills
    serviceAccountName: pi-agent-worker
    provider: freetoken
    model: gtp-oss-20b
    workingDir: /workspace
    noExtensions: true
    extensions:
      - npm:pi-graft
    timeout: 15m
    prompt: |-
      You are a Kubernetes rollout recovery agent.

      Load the runtime skills first, then confirm the Deployment still has zero available replicas. If it has already recovered, summarize that fact and exit.

      Diagnose the rollout by checking Deployment conditions, ReplicaSets, Pods, container states, recent Events, image pull errors, scheduling failures, probe failures, and config/secret references.

      Prefer targeted remediation: describe the likely root cause, restart or roll back only when the evidence is strong and the action is safe, and leave a clear operator summary of what changed.

      If you cannot safely remediate, create a concise incident note with the probable cause and next manual action.
