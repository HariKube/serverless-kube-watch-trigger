name: Release

on:
  push:
    branches:
    - release-v**
    - rc-v**
    - beta-v**
    - alpha-v**
    - dev-v**

concurrency: 
  group: ${{ github.ref_name }}-release
  cancel-in-progress: true

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GIT_TOKEN  }}
  
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Clone the code
      uses: actions/checkout@v4
      with:
          fetch-depth: 0
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
          go-version-file: go.mod
    - name: Extract branch name
      run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
      id: extract_branch
    - name: Login to registry
      uses: docker/login-action@v3
      with:
        registry: ${{ vars.REGISTRY }}
        username: ${{ vars.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    - name: Generate bundle
      run: make package
      env:
        IMG: ${{ vars.REGISTRY }}/${{ vars.REPOSITORY }}/serverless-kube-watch-trigger:${{ steps.extract_branch.outputs.branch }}
        TAG: ${{ steps.extract_branch.outputs.branch }}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build and push (forks)
      uses: docker/build-push-action@v6
      with:
        platforms: linux/arm64,linux/amd64,linux/s390x,linux/ppc64le
        context: .
        push: true
        tags: |
          ${{ vars.REGISTRY }}/${{ vars.REPOSITORY }}/serverless-kube-watch-trigger:${{ steps.extract_branch.outputs.branch }}
    - name: Create release
      if: ${{ !startsWith(github.ref, 'refs/heads/dev-') }}
      uses: mhmxs/milestone-release-action@main
      with:
        milestone-title: ${{ steps.extract_branch.outputs.branch }}
        pre-body: |
            # serverless-kube-watch-trigger
            A lightweight Kubernetes operator that turns **Kubernetes API server watch events into trigger sources** for serverless functions and external systems. It allows you to declaratively define *when* and *how* functions or webhooks should fire in response to changes in Kubernetes resources — without modifying the API server or deploying heavy eventing frameworks.

            ## Configuration
            For apply any configuration option please edit the Kubernetes manifests below and add extra arguments there.

            - `--namespace`: The namespace the operator reacts on trigger events. Default is all namespaces.
            - `--label-selectors`: The label selectors the operator reacts on trigger events.
            - `--field-selectors`: The field selectors the operator reacts on trigger events.
            - `--max-concurrent-reconciles`: The maximum number of concurrent Reconciles which can be run. Default: 1.

            ## Kubernetes Client Configuration
            If --kubeconfig, or KUBECONFIG is set, will use the kubeconfig file at that location.  Otherwise will assume running
            in cluster and use the cluster provided kubeconfig.

            Config precedence:

            * --kubeconfig flag pointing at a file
            * KUBECONFIG environment variable pointing at a file
            * In-cluster config if running in cluster
            * $HOME/.kube/config if exists.

            > Requires `WatchList` feature gate enabled.

            ## Installation
            `kubectl apply -f https://github.com/HariKube/serverless-kube-watch-trigger/releases/download/${{ steps.extract_branch.outputs.branch }}/bundle-${{ steps.extract_branch.outputs.branch }}.yaml`

            ## Release Notes
        draft: true
        prerelease: ${{ startsWith(github.ref, 'refs/heads/rc-') || startsWith(github.ref, 'refs/heads/beta-') || startsWith(github.ref, 'refs/heads/alpha-') }}
        files: package/bundle-${{ steps.extract_branch.outputs.branch }}.yaml,package/bundle-rbac-${{ steps.extract_branch.outputs.branch }}.yaml
  
